name: Deploy web preview to GitHub Pages

on:
  push:
    branches: [claude/haven-ly-mobile-setup-68t2vh]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx expo export --platform web --output-dir dist
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_OFFLINE: 1
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}

      # GitHub Pages has no server-side rewrites, so a direct load of any
      # route other than / (e.g. /sign-in) 404s unless the 404 page is the
      # same SPA shell — expo-router then picks up the real route client-side.
      - run: cp dist/index.html dist/404.html

      # Serves the site from the custom domain instead of the default
      # <owner>.github.io/<repo>/ URL — GitHub Pages reads this file out of
      # the deployed artifact on every deploy, so it isn't a one-time UI
      # setting that could get lost switching branches/artifacts.
      - run: echo "openedcircle.com" > dist/CNAME

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
